name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            app/requirements.txt
            dashboard/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r dashboard/requirements.txt
          pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m py_compile app/*.py dashboard/app.py

      - name: Run selected tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/test_backtest.py
          pytest -q tests/test_data_quality.py
          pytest -q tests/test_import_binance_klines.py

      - name: Validate docker compose syntax
        run: |
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            docker compose config
          else
            echo "Docker Compose is unavailable on this runner; skipping syntax validation."
          fi
